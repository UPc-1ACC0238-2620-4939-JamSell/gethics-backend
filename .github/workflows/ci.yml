name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gethics
          POSTGRES_USER: gethics
          POSTGRES_PASSWORD: gethics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gethics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Lint (Checkstyle)
        run: ./mvnw -B checkstyle:check

      - name: Build and test
        run: ./mvnw -B verify
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_URL: jdbc:postgresql://localhost:5432/gethics
          DB_USER: gethics
          DB_PASSWORD: gethics


