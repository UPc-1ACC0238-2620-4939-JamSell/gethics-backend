spring:
  application:
    name: gethics
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: ${app.mail.enabled:false}

authorization:
  jwt:
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:60}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}

app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@gethics.com}
  frontend:
    reset-password-url: ${FRONTEND_RESET_PASSWORD_URL:http://localhost:4200/reset-password}
  password-reset:
    expiration-minutes: 30

gethics:
  sanitary:
    reminders:
      cron: 0 0 8 * * *
      zone: America/Lima
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    # TS04: la documentacion queda disponible en /docs (ruta ya permitida en WebSecurityConfiguration).
    path: /docs
    operations-sorter: method
    tags-sorter: alpha
