spring:
  application:
    name: gethics
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # El SMTP es opcional: solo se chequea cuando se usa (MAIL_ENABLED=true). Sin SMTP, el contributor "mail" marcaria
  # toda la app como DOWN. El resto de contributors (db, diskSpace, ping...) sigue activo.
  health:
    mail:
      enabled: ${app.mail.enabled:false}

# IAM. El secreto del JWT (minimo 32 caracteres) NO tiene valor por defecto aqui: dev lo define en application-dev.yaml
# y prod exige la variable de entorno JWT_SECRET.
authorization:
  jwt:
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:60}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@gethics.com}
  frontend:
    reset-password-url: ${FRONTEND_RESET_PASSWORD_URL:http://localhost:4200/reset-password}
  password-reset:
    expiration-minutes: 30

# Valores tecnicos por defecto (no reglas de negocio). El cron del job y el Clock comparten la misma zona.
gethics:
  sanitary:
    reminders:
      cron: 0 0 8 * * *
      zone: America/Lima

# Analytics & Alerts: niveles de riesgo que generan una alerta (gethics.analytics.alert-risk-levels, lista de RiskLevel
# en mayusculas: LOW, MEDIUM, HIGH, CRITICAL; tambien GETHICS_ANALYTICS_ALERT_RISK_LEVELS=HIGH,CRITICAL como variable
# de entorno). DECISION PENDIENTE DEL NEGOCIO: el informe no define que niveles disparan alertas, por eso NO hay valor
# por defecto. Ausente o vacio = ningun nivel genera alerta (generacion automatica inactiva) y la aplicacion arranca igual.
# Es una politica POSTERIOR a la clasificacion: no es el "umbral definido" de US-21 (indicadores -> anomalia), que
# tampoco esta definido.
#
# Analisis periodico de tendencias (gethics.analytics.analysis.cron, expresion cron de Spring; tambien
# GETHICS_ANALYTICS_ANALYSIS_CRON). La periodicidad no la define el negocio, por eso NO hay valor por defecto: ausente =
# job deshabilitado ("-", Scheduled.CRON_DISABLED). Sin ningun TrendDetector (hoy no existe ninguno) cada ejecucion no
# registra tendencias y solo despacha las alertas PENDING.
